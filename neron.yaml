# ═══════════════════════════════════════════════════════════════════
# neron.yaml — Configuration centrale de NeronOS
# Secrets dans /etc/neron/secrets.env
# ═══════════════════════════════════════════════════════════════════

model_map:
  fast: gemma4:31b-cloud
  default: mistral:latest
  code: deepseek-coder:6.7b

routing:
  code: Qwen2.5-Coder:1.5b
  reasoning: Qwen2.5-Coder:1.5b
  agent: Qwen2.5-Coder:1.5b
  chat: gemma4:31b-cloud
  fast: gemma4:31b-cloud
  default: gemma4:31b-cloud

strategy:
  code: parallel
  reasoning: single
  chat: single
  agent: single

llm:
  default_provider: ollama
  timeout: 300
  race_timeout: 60
  host: http://localhost:11434
  ollama_max_connections: 50
  ollama_max_keepalive_connections: 10
  llama_cpp_host: http://localhost:8081
  llama_cpp_max_connections: 4
  llama_cpp_max_keepalive_connections: 2
  llama_cpp_n_predict: 512
  llama_cpp_temperature: 0.7
  llama_cpp_stop:
    - "</s>"
    - "User:"
    - "Assistant:"
  claude_max_tokens: 1024
  claude_max_connections: 20
  claude_max_keepalive_connections: 5
  temperature: 0.7

neron_llm:
  url: http://u5-provider-llm-01:8765
  timeout: 120
  retry: 2

gguf_map:
  "gemma4:31b-cloud": /etc/neron/llama/models/Llama-3.2-1B-Instruct-Q4_K_M.gguf
  "mistral:latest": /etc/neron/llama/models/mistral-7b.gguf

code_agent:
  enabled: true
  model: Qwen2.5-Coder:1.5b
  backup_count: 10
  sandbox_timeout: 10
  self_review_on_startup: false

home_assistant:
  enabled: true
  url: http://100.90.194.109:8123
  token_env: HOMEASSISTANT_TOKEN
  sync_interval: 60

stt:
  model: tiny
  language: fr
  device: cpu
  compute_type: int8
  port: 8001

logs:
  dir: logs
  neron_log: neron.log
  watchdog_log: watchdog.log
  max_size_mb: 10
  backup_count: 5

memory:
  obsidian:
    enabled: true
    vault_path: /etc/neronOS/server/memory/obsidian
  db_path: /etc/neronOS/data/memory.db
  retention_days: 30

neron:
  endpoint: http://localhost:8010/input/text
  api_key_env: NERON_API_KEY
  log_level: INFO

scheduler:
  enabled: true
  daily_report_hour: 8
  generateur_hour: 2
  self_review_hour: 3
  memory_cleanup_days: 30

searxng:
  url: http://localhost:8080
  max_results: 5
  timeout: 10.0

server:
  host: 0.0.0.0
  port: 8010
  cors_origins:
    - http://localhost:3000
    - http://127.0.0.1:3000
    - http://localhost:8080
    - http://127.0.0.1:8080
    - https://homebox.tail7f8e60.ts.net:8443

system:
  watchdog_url: http://localhost:8003

telegram:
  enabled: true
  bot_token_env: TELEGRAM_BOT_TOKEN
  chat_id_env: TELEGRAM_CHAT_ID
  notify_on_start: true

twilio:
  enabled: true
  account_sid_env: TWILIO_ACCOUNT_SID
  auth_token_env: TWILIO_AUTH_TOKEN
  from_number_env: TWILIO_FROM_NUMBER
  to_number_env: TWILIO_TO_NUMBER

workspace:
  path: /etc/neronOS/workspace
  generator_script: /etc/neronOS/workspace/generateur.py

NEWS_API_KEY_ENV: NEWS_API_KEY
NEWS_COUNTRY: "fr"
NEWS_MAX_HEADLINES: 5

WEATHER_DEFAULT_CITY: "Paris"
