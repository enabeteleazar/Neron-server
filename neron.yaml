# ═══════════════════════════════════════════════════════════════════
# NERONOS - Configuration fonctionnelle
#
# Ce fichier contient uniquement la configuration du comportement
# de Néron. Aucune information d'infrastructure ou de secret.
#
# Infrastructure : neron.server.yaml
# Secrets        : secrets.env
# ═══════════════════════════════════════════════════════════════════

paths:
  root: .

config:
  server_override: neron.server.yaml

# ==================================================================
# SERVICES
# ==================================================================

neron_llm:
  enabled: true
  timeout: 120
  retry: 2

memory:
  enabled: true
  timeout: 10
  retry: 2

# ==================================================================
# MODELS
# ==================================================================

model_map:
  fast: llama3.2:3b
  default: mistral:latest
  code: deepseek-coder:6.7b

routing:
  code: Qwen2.5-Coder:1.5b
  reasoning: Qwen2.5-Coder:1.5b
  agent: Qwen2.5-Coder:1.5b
  chat: glm-5.2:cloud
  fast: glm-5.2:cloud
  default: glm-5.2:cloud

strategy:
  code: single
  reasoning: single
  chat: single
  agent: single

# ==================================================================
# LLM
# ==================================================================

llm:
  default_provider: ollama
  timeout: 300
  race_timeout: 60

  ollama_max_connections: 50
  ollama_max_keepalive_connections: 10

  llama_cpp_max_connections: 4
  llama_cpp_max_keepalive_connections: 2
  llama_cpp_n_predict: 512
  llama_cpp_temperature: 0.7

  llama_cpp_stop:
    - "</s>"
    - "User:"
    - "Assistant:"

  claude_max_tokens: 1024
  claude_max_connections: 20
  claude_max_keepalive_connections: 5

  temperature: 0.7

# ==================================================================
# CODE AGENT
# ==================================================================

code_agent:
  enabled: true
  model: Qwen2.5-Coder:1.5b
  backup_count: 10
  sandbox_timeout: 10
  self_review_on_startup: false

# ==================================================================
# HOME ASSISTANT
# ==================================================================

home_assistant:
  enabled: true
  sync_interval: 60

# ==================================================================
# STT
# ==================================================================

stt:
  model: tiny
  language: fr
  device: cpu
  compute_type: int8

# ==================================================================
# LOGS
# ==================================================================

logs:
  dir: logs
  neron_log: neron.log
  watchdog_log: watchdog.log
  max_size_mb: 10
  backup_count: 5

# ==================================================================
# CORE
# ==================================================================

neron:
  api_key_env: NERON_API_KEY
  log_level: INFO

# ==================================================================
# SCHEDULER
# ==================================================================

scheduler:
  enabled: true
  daily_report_hour: 8
  generateur_hour: 2
  self_review_hour: 3
  memory_cleanup_days: 30

# ==================================================================
# TELEGRAM
# ==================================================================

telegram:
  enabled: true
  bot_token_env: TELEGRAM_BOT_TOKEN
  chat_id_env: TELEGRAM_CHAT_ID
  notify_on_start: true

# ==================================================================
# TWILIO
# ==================================================================

twilio:
  enabled: true
  account_sid_env: TWILIO_ACCOUNT_SID
  auth_token_env: TWILIO_AUTH_TOKEN
  from_number_env: TWILIO_FROM_NUMBER
  to_number_env: TWILIO_TO_NUMBER

# ==================================================================
# WORKSPACE
# ==================================================================

workspace:
  path: /srv/homelab/server-1/neronOS/workspace
  generator_script: /srv/homelab/server-1/neronOS/workspace/generateur.py

# ==================================================================
# NEWS
# ==================================================================

news:
  country: fr
  max_headlines: 5

# ==================================================================
# WEATHER
# ==================================================================

weather:
  default_city: Paris
