[pytest]
pythonpath =
    server

testpaths =
    tests
    server/doctor
    server/core
    server/watchdog

norecursedirs =
    .git
    venv
    .venv
    runtime
    runtime/workspace/tools/tests
    workspace
    system/scripts/kdeps
    web
    node_modules
    __pycache__

python_files =
    test_*.py

asyncio_mode = auto
